[package]
name = "agent4market-desktop"
version = "0.8.2"
description = "Single-role Sales Director AI Assistant desktop shell"
authors = ["WorkFlow_Market contributors"]
edition = "2021"
license = "MIT"

[[bin]]
name = "Agent4Market"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
