name: Cross-platform validation

on:
  workflow_dispatch:
    inputs:
      windows_privacy_diagnostic:
        description: Run only the synthetic Windows private-path diagnostic
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-privacy-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_privacy_diagnostic
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect synthetic directory ownership and private creation
        shell: pwsh
        run: |
          @'
          import ctypes, json, tempfile, traceback
          from pathlib import Path
          from agent_platform import wechat_privacy as p
          current = p._win_current_sid()
          print("current_sid", p._win_sid_text(current), flush=True)
          def snapshot(path):
              handle = p._win_open_directory(path, p._READ_CONTROL)
              try:
                  owner, protected, aces = p._win_security_snapshot(handle)
                  print(json.dumps({"path": str(path), "owner": p._win_sid_text(owner),
                      "protected": protected, "aces": [(kind, flags, hex(mask), p._win_sid_text(sid) if sid else "")
                                                       for kind, flags, mask, sid in aces]}), flush=True)
                  try:
                      p._win_check_parent(handle, current)
                      print("parent_check PASS", flush=True)
                  except Exception:
                      traceback.print_exc()
              finally:
                  p._win_close(handle)
          with tempfile.TemporaryDirectory(prefix="a4m-acl-diagnostic-", dir=Path.home()) as temporary:
              base = Path(temporary)
              for path in p._win_parent_paths(base / "child"):
                  snapshot(path)
              for label, target in [("existing", base), ("new", base / "child")]:
                  print("ENSURE", label, flush=True)
                  try:
                      p._windows_ensure(target)
                      print("ensure PASS", flush=True)
                  except Exception:
                      traceback.print_exc()
                  if target.exists():
                      snapshot(target)
          '@ | python -
  sqlite-driver-gate:
    if: ${{ !inputs.windows_privacy_diagnostic }}
    name: SQLite gate · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            expected_arch: x64
            report_name: windows-x64
          - os: macos-15
            label: macOS Apple Silicon
            expected_arch: arm64
            report_name: macos-arm64
          - os: macos-15-intel
            label: macOS Intel
            expected_arch: x64
            report_name: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Run SQLite transaction and recovery gate
        run: >-
          node --no-warnings pi/tests/sqlite-driver-gate.mjs
          --expect-arch ${{ matrix.expected_arch }}
          --report tmp/sqlite-driver-gate/${{ matrix.report_name }}.json
      - name: Upload SQLite gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-driver-gate-${{ matrix.report_name }}-${{ github.sha }}
          path: tmp/sqlite-driver-gate/${{ matrix.report_name }}.json
          if-no-files-found: error
          retention-days: 14

  validate:
    if: ${{ !inputs.windows_privacy_diagnostic }}
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install WXDecipher test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-wxdecipher.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: pnpm
      - name: Install reviewed dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            ./scripts/build-windows-desktop.ps1
            if ($LASTEXITCODE -ne 0) { throw "build-windows-desktop.ps1 exited with code $LASTEXITCODE" }
          } catch {
            $message = $_.Exception.Message -replace "`r?`n", " "
            Write-Output "::error title=Windows desktop build failed::$message"
            throw
          }
      - name: Build universal macOS desktop
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/build-macos-desktop.sh
      - name: Configure governed runtime and validate project
        run: |
          python -m agent_platform configure-subagents
          python -m agent_platform validate
      - name: Report installer-provided host tools
        continue-on-error: true
        run: |
          python -m agent_platform doctor
      - name: Check TypeScript and governed runtime
        run: |
          pnpm check:types
          pnpm test:runtime
      - name: Validate PPT rendering when LibreOffice is available on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Candidates = @(
            (Join-Path ${env:ProgramFiles} "LibreOffice\program\soffice.com"),
            (Join-Path ${env:ProgramFiles} "LibreOffice\program\soffice.exe")
          )
          $LibreOffice = $Candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if ($LibreOffice) {
            $env:WORKFLOW_LIBREOFFICE_PATH = $LibreOffice
            pnpm test:ppt-e2e
          } else {
            Write-Output "::notice title=PPT render test skipped::LibreOffice is not preinstalled on this runner; deterministic deck tests still run in pnpm test:runtime."
          }
      - name: Validate PPT rendering when LibreOffice is available on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          LIBREOFFICE_PATH=""
          for candidate in "/Applications/LibreOffice.app/Contents/MacOS/soffice" "/opt/homebrew/bin/soffice" "/usr/local/bin/soffice"; do
            if [ -x "$candidate" ]; then LIBREOFFICE_PATH="$candidate"; break; fi
          done
          if [ -n "$LIBREOFFICE_PATH" ]; then
            WORKFLOW_LIBREOFFICE_PATH="$LIBREOFFICE_PATH" pnpm test:ppt-e2e
          else
            printf '%s\n' '::notice title=PPT render test skipped::LibreOffice is not preinstalled on this runner; deterministic deck tests still run in pnpm test:runtime.'
          fi
      - name: Run Python and workbench tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PrivateTemp = Join-Path $env:SystemDrive "agent4market-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $PrivateTemp | Out-Null
          $Account = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          icacls.exe $PrivateTemp /inheritance:r /grant:r "${Account}:(OI)(CI)F" "SYSTEM:(OI)(CI)F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not protect the Python test root" }
          if (Test-Path -LiteralPath "P:\") { throw "Private test drive P: is already in use" }
          subst.exe P: $PrivateTemp
          if ($LASTEXITCODE -ne 0) { throw "Could not mount the private Python test root" }
          try {
            $env:TEMP = "P:\"
            $env:TMP = "P:\"
            $env:USERPROFILE = "P:\"
            python -m unittest discover -s tests -t . -v
            if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }
            python -m unittest ui.test_server -v
            if ($LASTEXITCODE -ne 0) { throw "Workbench tests failed" }
          } finally {
            subst.exe P: /D
          }
      - name: Run Python and workbench tests on macOS
        if: runner.os == 'macOS'
        run: |
          python -m unittest discover -s tests -t . -v
          python -m unittest ui.test_server -v
      - name: Upload universal macOS desktop package
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Agent4Market-macOS-universal-${{ github.sha }}
          path: |
            dist/macos/universal-apple-darwin/Agent4Market-universal-apple-darwin.dmg
            dist/macos/universal-apple-darwin/Agent4Market-universal-apple-darwin-app.zip
            dist/macos/universal-apple-darwin/Agent4Market-universal-apple-darwin-runtime.zip
            dist/macos/universal-apple-darwin/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
