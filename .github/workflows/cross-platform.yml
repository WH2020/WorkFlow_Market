name: Cross-platform validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite-driver-gate:
    name: SQLite gate · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            expected_arch: x64
            report_name: windows-x64
          - os: macos-15
            label: macOS Apple Silicon
            expected_arch: arm64
            report_name: macos-arm64
          - os: macos-15-intel
            label: macOS Intel
            expected_arch: x64
            report_name: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Run SQLite transaction and recovery gate
        run: >-
          node --no-warnings pi/tests/sqlite-driver-gate.mjs
          --expect-arch ${{ matrix.expected_arch }}
          --report tmp/sqlite-driver-gate/${{ matrix.report_name }}.json
      - name: Upload SQLite gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-driver-gate-${{ matrix.report_name }}-${{ github.sha }}
          path: tmp/sqlite-driver-gate/${{ matrix.report_name }}.json
          if-no-files-found: error
          retention-days: 14

  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - name: Install reviewed dependencies
        run: pnpm install --frozen-lockfile
      - name: Exercise Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            ./scripts/setup-windows.ps1 -SkipDependencies -SkipPiInstall
            if ($LASTEXITCODE -ne 0) { throw "setup-windows.ps1 exited with code $LASTEXITCODE" }
          } catch {
            $message = $_.Exception.Message -replace "`r?`n", " "
            Write-Output "::error title=Windows setup failed::$message"
            throw
          }
      - name: Exercise macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/setup-macos.sh --skip-dependencies --skip-pi-install
      - name: Validate platform and runtime
        run: |
          python -m agent_platform validate
          python -m agent_platform doctor
          pnpm check:types
          pnpm test:runtime
          pnpm test:ppt-e2e
      - name: Run Python and workbench tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest ui.test_server -v
      - name: Upload universal macOS desktop package
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Agent4Market-macOS-universal-${{ github.sha }}
          path: |
            dist/macos/universal-apple-darwin/Agent4Market-universal-apple-darwin.dmg
            dist/macos/universal-apple-darwin/Agent4Market-universal-apple-darwin-app.zip
            dist/macos/universal-apple-darwin/Agent4Market-universal-apple-darwin-runtime.zip
            dist/macos/universal-apple-darwin/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
