<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">PPT 工作室使用流程</title>
  <desc id="desc">从选择场景、需求澄清、资料检索、大纲便利贴、逐页策划、冻结审批、私有生成、质量检查到输出可编辑 PPT 的完整流程。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102A43" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#527086"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#B44952"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, "Microsoft YaHei", sans-serif; fill: #102A43; }
      .subtitle { font: 400 18px Inter, "Microsoft YaHei", sans-serif; fill: #647586; }
      .stage { font: 700 14px Inter, "Microsoft YaHei", sans-serif; letter-spacing: 1px; fill: #087E8B; }
      .node-title { font: 700 21px Inter, "Microsoft YaHei", sans-serif; fill: #172B3A; }
      .node-body { font: 400 15px Inter, "Microsoft YaHei", sans-serif; fill: #5B6B79; }
      .badge { font: 700 14px Inter, "Microsoft YaHei", sans-serif; fill: white; }
      .decision { font: 700 19px Inter, "Microsoft YaHei", sans-serif; fill: #6B4104; }
      .decision-body { font: 400 14px Inter, "Microsoft YaHei", sans-serif; fill: #7B5A25; }
      .edge-label { font: 700 14px Inter, "Microsoft YaHei", sans-serif; fill: #526879; }
      .rework-label { font: 700 14px Inter, "Microsoft YaHei", sans-serif; fill: #A43E47; }
      .legend { font: 500 14px Inter, "Microsoft YaHei", sans-serif; fill: #5B6B79; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#F4F7F9"/>
  <rect x="44" y="42" width="1512" height="916" rx="28" fill="#FFFFFF" stroke="#DDE5EA"/>
  <text x="90" y="108" class="title">PPT 工作室使用流程</text>
  <text x="90" y="143" class="subtitle">文章方法：先问、再查、先策划、后设计　×　当前 Agent：证据绑定、精确审批、生成质检、审计留痕</text>

  <text x="90" y="195" class="stage">A · 明确任务</text>
  <text x="90" y="430" class="stage">B · 组织内容</text>
  <text x="90" y="665" class="stage">C · 受控生成</text>

  <!-- Row A -->
  <g filter="url(#shadow)">
    <rect x="90" y="220" width="280" height="142" rx="18" fill="#F5FBFC" stroke="#9CCFD4"/>
    <circle cx="120" cy="250" r="18" fill="#087E8B"/><text x="120" y="255" text-anchor="middle" class="badge">1</text>
    <text x="148" y="257" class="node-title">选择场景与模式</text>
    <text x="118" y="298" class="node-body">周报 / 方案 / 研究 / 自定义</text>
    <text x="118" y="325" class="node-body">快速、标准或严格模式</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="435" y="220" width="280" height="142" rx="18" fill="#F5FBFC" stroke="#9CCFD4"/>
    <circle cx="465" cy="250" r="18" fill="#087E8B"/><text x="465" y="255" text-anchor="middle" class="badge">2</text>
    <text x="493" y="257" class="node-title">需求澄清</text>
    <text x="463" y="298" class="node-body">受众、目的、时间、页数</text>
    <text x="463" y="325" class="node-body">模板、保密范围、决策事项</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="780" y="220" width="280" height="142" rx="18" fill="#F5FBFC" stroke="#9CCFD4"/>
    <circle cx="810" cy="250" r="18" fill="#087E8B"/><text x="810" y="255" text-anchor="middle" class="badge">3</text>
    <text x="838" y="257" class="node-title">资料与证据包</text>
    <text x="808" y="298" class="node-body">知识库、网页、PDF、台账</text>
    <text x="808" y="325" class="node-body">事实 / 判断 / 假设 / 未知</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1125" y="220" width="280" height="142" rx="18" fill="#F5FBFC" stroke="#9CCFD4"/>
    <circle cx="1155" cy="250" r="18" fill="#087E8B"/><text x="1155" y="255" text-anchor="middle" class="badge">4</text>
    <text x="1183" y="257" class="node-title">大纲便利贴</text>
    <text x="1153" y="298" class="node-body">一页一个中心结论</text>
    <text x="1153" y="325" class="node-body">拖拽排序、增删、补证据</text>
  </g>

  <path d="M370 291 H425" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M715 291 H770" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1060 291 H1115" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Row B, right to left -->
  <g filter="url(#shadow)">
    <path d="M1265 452 L1375 521 L1265 590 L1155 521 Z" fill="#FFF7E6" stroke="#E4B65E" stroke-width="2"/>
    <text x="1265" y="512" text-anchor="middle" class="decision">确认大纲？</text>
    <text x="1265" y="540" text-anchor="middle" class="decision-body">顺序、重点、页数</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="780" y="450" width="280" height="142" rx="18" fill="#F7F8FF" stroke="#B9C2E3"/>
    <circle cx="810" cy="480" r="18" fill="#4F5D95"/><text x="810" y="485" text-anchor="middle" class="badge">6</text>
    <text x="838" y="487" class="node-title">逐页策划稿</text>
    <text x="808" y="528" class="node-body">结论、证据、版面意图</text>
    <text x="808" y="555" class="node-body">图表、讲稿、待确认项</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="435" y="450" width="280" height="142" rx="18" fill="#F7F8FF" stroke="#B9C2E3"/>
    <circle cx="465" cy="480" r="18" fill="#4F5D95"/><text x="465" y="485" text-anchor="middle" class="badge">7</text>
    <text x="493" y="487" class="node-title">风格与布局系统</text>
    <text x="463" y="528" class="node-body">公司模板 / 设计令牌</text>
    <text x="463" y="555" class="node-body">Bento 卡片按内容选型</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="90" y="450" width="280" height="142" rx="18" fill="#F7F8FF" stroke="#B9C2E3"/>
    <circle cx="120" cy="480" r="18" fill="#4F5D95"/><text x="120" y="485" text-anchor="middle" class="badge">8</text>
    <text x="148" y="487" class="node-title">结构预览与检查</text>
    <text x="118" y="528" class="node-body">页面缩略图、来源覆盖</text>
    <text x="118" y="555" class="node-body">字数、字号、风险提示</text>
  </g>

  <path d="M1265 362 V440" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1280" y="412" class="edge-label">进入确认</text>
  <path d="M1155 521 H1070" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1090" y="506" class="edge-label">确认</text>
  <path d="M780 521 H725" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M435 521 H380" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1265 590 V620 H1418 V291 H1415" fill="none" stroke="#B44952" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
  <text x="1308" y="617" class="rework-label">调整后回到便利贴</text>

  <!-- Row C -->
  <g filter="url(#shadow)">
    <rect x="90" y="690" width="280" height="142" rx="18" fill="#EEF6FA" stroke="#9AB8C8"/>
    <circle cx="120" cy="720" r="18" fill="#176B87"/><text x="120" y="725" text-anchor="middle" class="badge">9</text>
    <text x="148" y="727" class="node-title">冻结完整载荷</text>
    <text x="118" y="768" class="node-body">快照、来源版本、逐页内容</text>
    <text x="118" y="795" class="node-body">生成精确 SHA-256</text>
  </g>
  <g filter="url(#shadow)">
    <path d="M575 688 L685 761 L575 834 L465 761 Z" fill="#FFF7E6" stroke="#E4B65E" stroke-width="2"/>
    <text x="575" y="752" text-anchor="middle" class="decision">硬审批</text>
    <text x="575" y="780" text-anchor="middle" class="decision-body">批准的是完整载荷与哈希</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="780" y="690" width="280" height="142" rx="18" fill="#EEF6FA" stroke="#9AB8C8"/>
    <circle cx="810" cy="720" r="18" fill="#176B87"/><text x="810" y="725" text-anchor="middle" class="badge">11</text>
    <text x="838" y="727" class="node-title">私有生成与 QA</text>
    <text x="808" y="768" class="node-body">独立引擎生成并渲染 PPTX</text>
    <text x="808" y="795" class="node-body">逐页渲染、溢出与来源检查</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1125" y="690" width="280" height="142" rx="18" fill="#E9F7F1" stroke="#7BC3A0"/>
    <circle cx="1155" cy="720" r="18" fill="#19835B"/><text x="1155" y="725" text-anchor="middle" class="badge">12</text>
    <text x="1183" y="727" class="node-title">交付可编辑 PPT</text>
    <text x="1153" y="768" class="node-body">正式文件、预览、receipt</text>
    <text x="1153" y="795" class="node-body">来源备注与审计记录</text>
  </g>

  <path d="M230 592 V680" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M370 761 H455" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M685 761 H770" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="706" y="744" class="edge-label">批准</text>
  <path d="M1060 761 H1115" fill="none" stroke="#527086" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M575 834 V884 H905 V842" fill="none" stroke="#B44952" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
  <text x="650" y="876" class="rework-label">驳回：回到策划，旧审批失效</text>
  <path d="M920 832 V915 H575 V844" fill="none" stroke="#B44952" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
  <text x="672" y="938" class="rework-label">QA 失败：不提交输出，修订后重新冻结与审批</text>

  <!-- Legend -->
  <rect x="1110" y="882" width="16" height="16" rx="4" fill="#F5FBFC" stroke="#9CCFD4"/><text x="1136" y="895" class="legend">Agent / Tool 自动处理</text>
  <rect x="1300" y="882" width="16" height="16" rx="4" fill="#FFF7E6" stroke="#E4B65E"/><text x="1326" y="895" class="legend">用户确认</text>
  <line x1="1110" y1="926" x2="1130" y2="926" stroke="#B44952" stroke-width="3" stroke-dasharray="7 5"/><text x="1142" y="931" class="legend">返工路径，不覆盖已有正式文件</text>
</svg>
